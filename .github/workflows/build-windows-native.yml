name: Build Windows Native Audio Module

on:
  push:
    branches: [native-audio-electron-video]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - mock
          - real

jobs:
  build-windows-module:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # Обновлено с v3 на v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4  # Обновлено с v3 на v4
      with:
        node-version: '18'
    
    - name: Install build tools
      run: |
        npm install -g node-gyp
        
    - name: Create native module directory
      run: |
        mkdir -p native-modules/win/src
        mkdir -p native-modules/win/build
        
    - name: Create simple test module
      run: |
        # Создаем простой тестовый C++ модуль
        @'
        #include <node_api.h>
        #include <windows.h>
        #include <string>
        
        // Простая функция для теста
        napi_value TestMethod(napi_env env, napi_callback_info info) {
            napi_value result;
            const char* message = "Windows Native Audio Module (GitHub Actions Build)";
            napi_create_string_utf8(env, message, NAPI_AUTO_LENGTH, &result);
            return result;
        }
        
        // Mock функция получения источников
        napi_value GetAvailableSources(napi_env env, napi_callback_info info) {
            napi_value array;
            napi_create_array_with_length(env, 2, &array);
            
            // Создаем тестовые источники
            napi_value source1, source2;
            napi_create_object(env, &source1);
            napi_create_object(env, &source2);
            
            napi_value id1, id2, name1, name2, type1, type2;
            napi_create_string_utf8(env, "1", NAPI_AUTO_LENGTH, &id1);
            napi_create_string_utf8(env, "2", NAPI_AUTO_LENGTH, &id2);
            napi_create_string_utf8(env, "System Audio", NAPI_AUTO_LENGTH, &name1);
            napi_create_string_utf8(env, "Microphone", NAPI_AUTO_LENGTH, &name2);
            napi_create_string_utf8(env, "output", NAPI_AUTO_LENGTH, &type1);
            napi_create_string_utf8(env, "input", NAPI_AUTO_LENGTH, &type2);
            
            napi_set_named_property(env, source1, "id", id1);
            napi_set_named_property(env, source1, "name", name1);
            napi_set_named_property(env, source1, "type", type1);
            
            napi_set_named_property(env, source2, "id", id2);
            napi_set_named_property(env, source2, "name", name2);
            napi_set_named_property(env, source2, "type", type2);
            
            napi_set_element(env, array, 0, source1);
            napi_set_element(env, array, 1, source2);
            
            return array;
        }
        
        // StartCapture функция
        napi_value StartCapture(napi_env env, napi_callback_info info) {
            napi_value result;
            napi_create_object(env, &result);
            
            napi_value success;
            napi_get_boolean(env, true, &success);
            napi_set_named_property(env, result, "success", success);
            
            return result;
        }
        
        // StopCapture функция
        napi_value StopCapture(napi_env env, napi_callback_info info) {
            napi_value result;
            napi_create_object(env, &result);
            
            napi_value success;
            napi_get_boolean(env, true, &success);
            napi_set_named_property(env, result, "success", success);
            
            return result;
        }
        
        // Заглушки для callbacks
        napi_value SetWebRTCAudioCallback(napi_env env, napi_callback_info info) {
            return nullptr;
        }
        
        napi_value SetWebRTCVideoCallback(napi_env env, napi_callback_info info) {
            return nullptr;
        }
        
        // Инициализация модуля
        napi_value Init(napi_env env, napi_value exports) {
            napi_property_descriptor desc[] = {
                {"testMethod", nullptr, TestMethod, nullptr, nullptr, nullptr, napi_default, nullptr},
                {"getAvailableSources", nullptr, GetAvailableSources, nullptr, nullptr, nullptr, napi_default, nullptr},
                {"startCapture", nullptr, StartCapture, nullptr, nullptr, nullptr, napi_default, nullptr},
                {"stopCapture", nullptr, StopCapture, nullptr, nullptr, nullptr, napi_default, nullptr},
                {"setWebRTCAudioCallback", nullptr, SetWebRTCAudioCallback, nullptr, nullptr, nullptr, napi_default, nullptr},
                {"setWebRTCVideoCallback", nullptr, SetWebRTCVideoCallback, nullptr, nullptr, nullptr, napi_default, nullptr}
            };
            
            napi_define_properties(env, exports, sizeof(desc) / sizeof(desc[0]), desc);
            return exports;
        }
        
        NAPI_MODULE(NODE_GYP_MODULE_NAME, Init)
        '@ | Out-File -Encoding UTF8 native-modules/win/src/test_module.cpp
        
    - name: Create binding.gyp
      run: |
        @'
        {
          "targets": [
            {
              "target_name": "screen_capture_win",
              "sources": [ "src/test_module.cpp" ],
              "defines": [ "NAPI_DISABLE_CPP_EXCEPTIONS" ]
            }
          ]
        }
        '@ | Out-File -Encoding UTF8 native-modules/win/binding.gyp
        
    - name: Build native module
      run: |
        cd native-modules/win
        npm init -y
        node-gyp configure
        node-gyp build
        
    - name: List built files
      run: |
        echo "=== Built files ==="
        dir native-modules\win\build\Release\
        
    - name: Test module
      run: |
        node -e "try { const m = require('./native-modules/win/build/Release/screen_capture_win.node'); console.log('Module loaded!'); console.log('Test:', m.testMethod()); } catch(e) { console.log('Error:', e.message); }"
        
    - name: Upload module
      uses: actions/upload-artifact@v4  # Обновлено с v3 на v4
      with:
        name: windows-native-audio-module
        path: |
          native-modules/win/build/Release/*.node
          
    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2  # Обновлено на v2
      with:
        tag_name: audio-module-build-${{ github.run_number }}
        name: Audio Module Build ${{ github.run_number }}
        files: native-modules/win/build/Release/screen_capture_win.node
        body: |
          Windows native audio capture module
          Build: ${{ github.run_number }}
          Commit: ${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
